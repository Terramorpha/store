[project]
name = "store"
version = "0.1.0"
description = "A tiny content-addressed build store: declare derivations as Python functions, realize them once into a hash-named store directory."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Justin Veilleux" }]
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.0",
    "gitpython>=3.1.0",
    "requests>=2.32.3",
    "rich>=14.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
